<!doctype html>
<html lang="id" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Inka" />
    <meta name="application-name" content="Inka" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Inka – Interactive Japanese Flashcard PWA with Interval Scheduling" />
    <title>Inka – Interactive Flashcards</title>
    <!-- Google Fonts: Noto Sans JP (Full Weights) & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
      /* Splash screen: tampil instan sebelum JS siap, lalu memudar (lihat src/main.tsx) */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
        background: radial-gradient(circle at 50% 42%, #1e293b 0%, #0f172a 55%, #020617 100%);
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #splash.splash-hide { opacity: 0; visibility: hidden; }
      #splash img {
        width: 112px; height: 112px; border-radius: 26px;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 20px 50px rgba(0,0,0,0.5);
        animation: splash-in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      #splash .splash-name {
        font: 700 22px/1 Inter, system-ui, sans-serif; letter-spacing: 0.32em; color: #f8fafc;
        padding-left: 0.32em; animation: splash-in 0.6s 0.15s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      #splash .splash-bar {
        width: 72px; height: 3px; border-radius: 3px; background: rgba(255,255,255,0.12); overflow: hidden;
        animation: splash-in 0.6s 0.3s both;
      }
      #splash .splash-bar::after {
        content: ''; display: block; height: 100%; width: 40%; border-radius: 3px; background: #818cf8;
        animation: splash-load 1.1s ease-in-out infinite;
      }
      @keyframes splash-in { from { opacity: 0; transform: translateY(8px) scale(0.96); } to { opacity: 1; transform: none; } }
      @keyframes splash-load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash img, #splash .splash-name, #splash .splash-bar, #splash .splash-bar::after { animation: none; transition: none; }
      }
    </style>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 transition-colors">
    <div id="splash" role="status" aria-label="Memuat Inka">
      <img src="/icon.svg" alt="" width="112" height="112" />
      <div class="splash-name">INKA</div>
      <div class="splash-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
